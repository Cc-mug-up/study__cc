<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务管理器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>任务管理器</h1>
      <p class="subtitle">记录和管理你的日常任务</p>
    </header>

    <form class="task-form" id="taskForm">
      <input
        type="text"
        class="task-input"
        id="taskInput"
        placeholder="输入新任务..."
        autocomplete="off"
      >
      <button type="submit" class="btn btn-add">
        <span>添加</span>
      </button>
    </form>

    <div class="toolbar">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="active">进行中</button>
        <button class="filter-btn" data-filter="completed">已完成</button>
      </div>
      <div class="stats">
        <span id="taskCount">0 个任务</span>
      </div>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="empty-state" id="emptyState">
      <p>暂无任务，添加一个吧</p>
    </div>

    <div class="actions-bar" id="actionsBar" style="display: none;">
      <button class="btn btn-clear" id="clearCompleted">清除已完成</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
